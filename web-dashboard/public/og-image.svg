<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="60%" stop-color="#064E3B" />
      <stop offset="100%" stop-color="#022C22" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="24" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />

  <!-- Grid Pattern Overlay -->
  <g opacity="0.08" stroke="#FFFFFF" stroke-width="1">
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="200" x2="1200" y2="200" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="400" x2="1200" y2="400" />
    <line x1="0" y1="500" x2="1200" y2="500" />
    <line x1="200" y1="0" x2="200" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="800" y1="0" x2="800" y2="630" />
    <line x1="1000" y1="0" x2="1000" y2="630" />
  </g>

  <!-- Left Content: Brand & Value Prop -->
  <!-- Logo Pill -->
  <g transform="translate(80, 80)">
    <rect width="160" height="44" rx="22" fill="#10B981" fill-opacity="0.15" stroke="#10B981" stroke-width="1.5" />
    <text x="24" y="28" font-family="Inter, sans-serif" font-size="16" font-weight="700" fill="#34D399">✨ GEMINI AI 2.0</text>
  </g>

  <!-- Main Headline -->
  <text x="80" y="200" font-family="Inter, sans-serif" font-size="56" font-weight="800" fill="#FFFFFF">NutriAI Web Dashboard</text>
  <text x="80" y="260" font-family="Inter, sans-serif" font-size="34" font-weight="700" fill="url(#emeraldGrad)">Theo dõi Calo &amp; Dinh dưỡng thông minh</text>

  <!-- Subtitle -->
  <text x="80" y="320" font-family="Inter, sans-serif" font-size="20" font-weight="400" fill="#94A3B8">Quét ảnh đĩa ăn tự động • Bóc tách Macros chính xác • Cân đối mục tiêu sức khỏe</text>

  <!-- 3 Feature Badges -->
  <g transform="translate(80, 380)">
    <!-- Badge 1: Carbs -->
    <rect x="0" y="0" width="160" height="50" rx="12" fill="#1E293B" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="20" y="31" font-family="Inter, sans-serif" font-size="16" font-weight="700" fill="#F59E0B">🍚 Carbs: 220g</text>

    <!-- Badge 2: Protein -->
    <rect x="180" y="0" width="160" height="50" rx="12" fill="#1E293B" stroke="#3B82F6" stroke-width="1.5"/>
    <text x="200" y="31" font-family="Inter, sans-serif" font-size="16" font-weight="700" fill="#60A5FA">🥩 Protein: 130g</text>

    <!-- Badge 3: Fat -->
    <rect x="360" y="0" width="160" height="50" rx="12" fill="#1E293B" stroke="#EC4899" stroke-width="1.5"/>
    <text x="380" y="31" font-family="Inter, sans-serif" font-size="16" font-weight="700" fill="#F472B6">🥑 Fat: 60g</text>
  </g>

  <!-- Bottom Brand Footer -->
  <text x="80" y="550" font-family="Inter, sans-serif" font-size="18" font-weight="600" fill="#64748B">nutriai.app • Sẵn sàng trên Web, iOS &amp; Android</text>

  <!-- Right Showcase Mockup Card -->
  <g transform="translate(760, 110)" filter="url(#shadow)">
    <!-- Card Surface -->
    <rect width="360" height="420" rx="24" fill="#1E293B" stroke="#334155" stroke-width="2" />

    <!-- Donut Circle Placeholder Art -->
    <circle cx="180" cy="160" r="85" stroke="#334155" stroke-width="18" fill="none"/>
    <circle cx="180" cy="160" r="85" stroke="#10B981" stroke-width="18" stroke-dasharray="380 534" stroke-linecap="round" fill="none" transform="rotate(-90 180 160)"/>

    <!-- Inner Donut Text -->
    <text x="180" y="150" text-anchor="middle" font-family="Inter, sans-serif" font-size="36" font-weight="800" fill="#FFFFFF">1,450</text>
    <text x="180" y="175" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#94A3B8">/ 2,000 kcal</text>
    <text x="180" y="200" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#10B981">72.5% Hoàn thành</text>

    <!-- Scan Button Pill -->
    <rect x="40" y="290" width="280" height="52" rx="14" fill="#10B981" />
    <text x="180" y="322" text-anchor="middle" font-family="Inter, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">✨ Bắt đầu phân tích Calo</text>

    <!-- Mini Subtitle -->
    <text x="180" y="375" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" font-weight="500" fill="#64748B">Gemini Flash Vision AI Engine</text>
  </g>
</svg>
