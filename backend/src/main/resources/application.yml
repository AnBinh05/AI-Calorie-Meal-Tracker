server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: ai-calorie-tracker
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:calorie_tracker_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 15MB

jwt:
  secret: ${JWT_SECRET:}
  expiration-ms: 86400000 # 24 hours
  refresh-expiration-ms: 604800000 # 7 days

gemini:
  api-key: ${GEMINI_API_KEY:}
  model: ${GEMINI_MODEL:gemini-1.5-flash}
  api-url: https://generativelanguage.googleapis.com/v1beta/models

aws:
  s3:
    bucket-name: ${AWS_S3_BUCKET:calorie-tracker-meals}
    region: ${AWS_REGION:ap-southeast-1}
    access-key: ${AWS_ACCESS_KEY_ID:}
    secret-key: ${AWS_SECRET_ACCESS_KEY:}
    enabled: ${AWS_S3_ENABLED:false}

storage:
  local-dir: ${LOCAL_STORAGE_DIR:./uploads}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
